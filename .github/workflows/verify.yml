name: Verify plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run generate && npm run generate-worker
      - run: npx elm-format src tests --validate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test-ts -- --runInBand
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test-browser
        env:
          PRODUCTION_SMOKE: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: card-board-plugin
          path: |
            main.js
            manifest.json
            styles.css
